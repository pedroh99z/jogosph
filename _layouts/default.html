<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 }}">
    <title>{{ page.title }} - Jogosph</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" type="text/css" media="all">
    <link rel="shortcut icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" type="image/x-icon">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll('a[href^="http"]').forEach(link => {
    const isExternal = link.hostname !== window.location.hostname;

    if (isExternal) {
      link.setAttribute("target", "_blank");
      link.setAttribute("rel", "noopener noreferrer");
    }
  });
});
</script>

  </head>
  <body>

    {% include header.html %}

    {% include navbar.html %}

    <main>

      {{ content }}

    </main>

    {% include footer.html %}

  </body>
</html>
